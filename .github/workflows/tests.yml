# Always-pass check: this repo has no test suite CI can run (reason below).
# The job is named `tests`: that is the check a default-branch rule requires once this repo moves into
# the gsa-llc organization, so it runs on every pull request and every push to main, with no path filter
# (a docs-only change still gets a verdict). No secrets are used or available to this job.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's runs share one group per ref, so a newer push cancels the older run. Each push to the default
# branch gets its own group (its commit sha), so no default-branch run is ever cancelled or replaced by a later one.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: 'echo "No test suite: rigledger-site is static pages served by GitHub Pages."'
